name: Linux installation smoke test

on:
  push:
    branches: [main, dxregia-linux-validation]
  pull_request:
    paths: ['dxregia/**', 'perl/**', 'cmd/**', 'data/**', '.github/workflows/linux-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            web_port: '8080'
            telnet_port: '7300'
          - runner: ubuntu-24.04-arm
            web_port: '8787'
            telnet_port: '7373'
    runs-on: ${{ matrix.runner }}
    env:
      DXREGIA_WEB_PORT: ${{ matrix.web_port }}
      DXREGIA_TELNET_PORT: ${{ matrix.telnet_port }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locally on a fresh Docker runner
        run: sh dxregia/deploy/install-local.sh > "$RUNNER_TEMP/dxregia-install.txt"
      - name: Verify setup, two factors, Telnet, persistent restart and backup
        run: python3 dxregia/deploy/smoke_linux.py
      - name: Verify installer can run again without replacing the node
        run: sh dxregia/deploy/install-local.sh
      - name: Report container logs on failure
        if: failure()
        run: |
          docker logs --tail 80 dxregia || true
          docker cp dxregia:/data/mojo/local_data/dxregia-startup.log "$RUNNER_TEMP/mojo-startup.log" || exit 0
          grep -E "Can't locate|Compilation failed|BEGIN failed|Permission denied|[Ee]rror|Address already in use" "$RUNNER_TEMP/mojo-startup.log" || true

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DXREGIA_SMOKE_NATIVE: '1'
      DXREGIA_ARCH: ${{ matrix.arch }}
      DXREGIA_WEB_PORT: '8788'
      DXREGIA_TELNET_PORT: '7374'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'
          cache-dependency-path: dxregia/backend/go.sum
      - name: Build and verify the native bundle
        run: |
          mkdir "$RUNNER_TEMP/bundle"
          sh dxregia/deploy/build-native-bundle.sh "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c "dxregia-linux-$DXREGIA_ARCH.tar.gz.sha256"
          tar -xzf "dxregia-linux-$DXREGIA_ARCH.tar.gz"
      - name: Install the prebuilt native systemd service
        run: sh "$RUNNER_TEMP/bundle/dxregia-linux-$DXREGIA_ARCH/dxregia/deploy/install-native.sh" > "$RUNNER_TEMP/dxregia-native-install.txt"
      - name: Verify native setup, Telnet, restart and backup
        run: python3 dxregia/deploy/smoke_linux.py
      - name: Verify the native installer preserves existing data
        run: sh "$RUNNER_TEMP/bundle/dxregia-linux-$DXREGIA_ARCH/dxregia/deploy/install-native.sh"
      - name: Report native service logs on failure
        if: failure()
        run: |
          sudo journalctl -u dxregia.service --no-pager -n 80
          sudo grep -E "Can't locate|Compilation failed|BEGIN failed|Permission denied|[Ee]rror|Address already in use" /var/lib/dxregia/mojo/local_data/dxregia-startup.log || true
